<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>VibeChat — คุยกันได้เลย</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --accent: #7c5cfc;
    --accent2: #a78bfa;
    --pink: #f472b6;
    --green: #4ade80;
    --text: #f1f0f5;
    --muted: #8884a0;
    --bubble-me: #7c5cfc;
    --bubble-other: #22222c;
    --radius: 18px;
    --font: 'Noto Sans Thai', 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); }

  /* ── SETUP SCREEN ── */
  #setup {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); padding: 24px;
  }
  .setup-logo { font-size: 42px; margin-bottom: 8px; }
  .setup-title { font-size: 26px; font-weight: 600; margin-bottom: 4px; }
  .setup-sub { font-size: 14px; color: var(--muted); margin-bottom: 36px; text-align: center; }
  .setup-card {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 24px; padding: 28px 24px; width: 100%; max-width: 360px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .setup-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .setup-input {
    width: 100%; padding: 13px 16px; border-radius: 14px;
    background: var(--surface2); border: 1px solid var(--border2);
    color: var(--text); font-size: 15px; font-family: var(--font);
    outline: none; transition: border-color 0.2s;
  }
  .setup-input:focus { border-color: var(--accent); }
  .setup-input::placeholder { color: var(--muted); }
  .avatar-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px;
  }
  .av-opt {
    aspect-ratio: 1; border-radius: 50%; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 2px solid transparent;
    transition: all 0.15s; background: var(--surface2);
  }
  .av-opt.selected { border-color: var(--accent); transform: scale(1.1); }
  .join-btn {
    padding: 14px; border-radius: 14px; border: none;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
    font-family: var(--font); cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .join-btn:hover { opacity: 0.9; }
  .join-btn:active { transform: scale(0.97); }

  /* ── MAIN APP ── */
  #app { display: none; flex-direction: column; height: 100vh; height: 100dvh; }

  /* topbar */
  #topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0; position: relative;
  }
  #topbar-logo { font-size: 22px; }
  #topbar-title { font-size: 16px; font-weight: 600; flex: 1; }
  #online-pill {
    display: flex; align-items: center; gap: 5px;
    background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.25);
    border-radius: 20px; padding: 4px 10px; font-size: 12px; color: var(--green);
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

  /* rooms */
  #rooms-bar {
    display: flex; gap: 8px; padding: 10px 16px;
    overflow-x: auto; flex-shrink: 0; border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  #rooms-bar::-webkit-scrollbar { display: none; }
  .room-chip {
    padding: 6px 16px; border-radius: 20px; white-space: nowrap;
    font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border2);
    background: transparent; color: var(--muted); font-family: var(--font);
    transition: all 0.15s; flex-shrink: 0;
  }
  .room-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* messages */
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 2px; }
  .msg-row.me { flex-direction: row-reverse; }

  .avatar-sm {
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; background: var(--surface2);
  }
  .msg-col { display: flex; flex-direction: column; gap: 2px; max-width: 72%; }
  .msg-row.me .msg-col { align-items: flex-end; }
  .msg-sender { font-size: 11px; color: var(--muted); padding: 0 6px; }
  .bubble {
    padding: 9px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.55; word-break: break-word;
    animation: popin 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes popin { from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)} }
  .bubble.other { background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 5px; }
  .bubble.me { background: var(--bubble-me); color: #fff; border-bottom-right-radius: 5px; }
  .msg-time { font-size: 10px; color: var(--muted); padding: 0 6px; }

  .reactions { display: flex; gap: 4px; padding: 0 6px; flex-wrap: wrap; }
  .react-pill {
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 2px 8px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 3px; transition: all 0.15s;
  }
  .react-pill:hover { border-color: var(--accent2); }
  .react-pill.mine { background: rgba(124,92,252,0.18); border-color: var(--accent); }
  .react-count { font-size: 11px; color: var(--muted); }

  /* system msg */
  .sys-msg {
    text-align: center; font-size: 12px; color: var(--muted);
    padding: 6px; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }

  /* typing */
  #typing-area {
    min-height: 24px; padding: 0 16px 4px; font-size: 12px; color: var(--muted);
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .typing-dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted); animation: blink 1.2s infinite; margin-right: 2px;
  }
  .typing-dots span:nth-child(2){animation-delay:0.2s}
  .typing-dots span:nth-child(3){animation-delay:0.4s}
  @keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}

  /* input */
  #input-area {
    padding: 10px 12px 12px; border-top: 1px solid var(--border);
    background: var(--bg); flex-shrink: 0;
  }
  #emoji-quick {
    display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none;
  }
  #emoji-quick::-webkit-scrollbar { display: none; }
  .eq-btn {
    font-size: 20px; background: none; border: none; cursor: pointer;
    padding: 2px 3px; border-radius: 8px; transition: transform 0.1s;
    flex-shrink: 0;
  }
  .eq-btn:active { transform: scale(1.3); }
  #input-row { display: flex; align-items: center; gap: 8px; }
  #msg-input {
    flex: 1; padding: 11px 16px; border-radius: 24px;
    background: var(--surface); border: 1px solid var(--border2);
    color: var(--text); font-size: 14px; font-family: var(--font);
    outline: none; transition: border-color 0.2s; resize: none;
    max-height: 100px; line-height: 1.4;
  }
  #msg-input:focus { border-color: var(--accent); }
  #msg-input::placeholder { color: var(--muted); }
  #send-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s, opacity 0.15s;
  }
  #send-btn:hover { opacity: 0.88; }
  #send-btn:active { transform: scale(0.92); }

  /* config modal */
  #config-modal {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); align-items: flex-end; justify-content: center;
  }
  #config-modal.open { display: flex; }
  .config-sheet {
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 24px; width: 100%; max-width: 480px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .config-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .cfg-btn {
    padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text); font-size: 14px;
    font-family: var(--font); cursor: pointer; text-align: left; transition: all 0.15s;
  }
  .cfg-btn:hover { border-color: var(--accent); }
  .cfg-close {
    padding: 12px; border-radius: 14px; border: none;
    background: var(--surface2); color: var(--muted); font-size: 14px;
    font-family: var(--font); cursor: pointer;
  }

  @media (min-width: 640px) {
    #app { max-width: 600px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    .config-sheet { border-radius: 24px; margin-bottom: 24px; }
  }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <div class="setup-logo">💬</div>
  <div class="setup-title">VibeChat</div>
  <div class="setup-sub">แชทได้เลย ไม่ต้องสมัคร<br>ทุกคนเห็นข้อความพร้อมกัน</div>
  <div class="setup-card">
    <div>
      <div class="setup-label">ชื่อที่ใช้แสดง</div>
      <input id="name-field" class="setup-input" placeholder="ตั้งชื่ออะไรก็ได้..." maxlength="20"/>
    </div>
    <div>
      <div class="setup-label">เลือกอวาตาร์</div>
      <div class="avatar-grid" id="avatar-grid"></div>
    </div>
    <button class="join-btn" onclick="joinChat()">เข้าห้องแชทเลย →</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <span id="topbar-logo">💬</span>
    <span id="topbar-title">VibeChat</span>
    <div id="online-pill">
      <div class="live-dot"></div>
      <span id="online-num">0</span> ออนไลน์
    </div>
    <button onclick="document.getElementById('config-modal').classList.add('open')"
      style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px">⋯</button>
  </div>

  <div id="rooms-bar"></div>

  <div id="messages"><div class="sys-msg">ยินดีต้อนรับ! 🎉 พิมพ์ข้อความแรกได้เลย</div></div>

  <div id="typing-area"></div>

  <div id="input-area">
    <div id="emoji-quick">
      <button class="eq-btn" onclick="addEmoji('😂')">😂</button>
      <button class="eq-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="eq-btn" onclick="addEmoji('💀')">💀</button>
      <button class="eq-btn" onclick="addEmoji('😭')">😭</button>
      <button class="eq-btn" onclick="addEmoji('🫶')">🫶</button>
      <button class="eq-btn" onclick="addEmoji('👀')">👀</button>
      <button class="eq-btn" onclick="addEmoji('✨')">✨</button>
      <button class="eq-btn" onclick="addEmoji('🤙')">🤙</button>
      <button class="eq-btn" onclick="addEmoji('😍')">😍</button>
      <button class="eq-btn" onclick="addEmoji('🥹')">🥹</button>
    </div>
    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="พิมพ์อะไรก็ได้..."></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- CONFIG MODAL -->
<div id="config-modal">
  <div class="config-sheet">
    <div class="config-title">⚙️ ตั้งค่า</div>
    <button class="cfg-btn" onclick="changeNamePrompt()">✏️ เปลี่ยนชื่อ / อวาตาร์</button>
    <button class="cfg-btn" onclick="clearLocalAndReload()">🚪 ออกจากห้อง</button>
    <button class="cfg-close" onclick="document.getElementById('config-modal').classList.remove('open')">ปิด</button>
  </div>
</div>

<!-- Socket.io (โหลดจาก server เดียวกัน) -->
<script src="/socket.io/socket.io.js"></script>
<script>
  const AVATARS = ['🐱','🐶','🦊','🐸','🐼','🐨','🦁','🐯','🦋','🦄','🐙','🦖'];
  const ROOMS = [
    { id: 'general', label: '💬 ทั่วไป' },
    { id: 'game',    label: '🎮 เกม' },
    { id: 'music',   label: '🎵 ดนตรี' },
    { id: 'art',     label: '🎨 ศิลปะ' },
    { id: 'random',  label: '🎲 มั่ว' },
  ];

  let socket, currentRoom = 'general', myId, myName, myAvatar;
  let typingTimer = null;
  const typingUsers = {};

  /* ── Avatar grid ── */
  const grid = document.getElementById('avatar-grid');
  let selectedAvatar = AVATARS[0];
  AVATARS.forEach(em => {
    const d = document.createElement('div');
    d.className = 'av-opt' + (em === selectedAvatar ? ' selected' : '');
    d.textContent = em;
    d.onclick = () => {
      selectedAvatar = em;
      document.querySelectorAll('.av-opt').forEach(x => x.classList.remove('selected'));
      d.classList.add('selected');
    };
    grid.appendChild(d);
  });

  /* ── Join ── */
  window.joinChat = function() {
    const name = document.getElementById('name-field').value.trim();
    if (!name) { document.getElementById('name-field').focus(); return; }
    myName = name;
    myAvatar = selectedAvatar;

    localStorage.setItem('vc_name', myName);
    localStorage.setItem('vc_avatar', myAvatar);

    document.getElementById('setup').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    // เชื่อมต่อ Socket.io
    socket = io();
    myId = null;

    socket.on('connect', () => {
      myId = socket.id;
      socket.emit('join', { name: myName, avatar: myAvatar, room: currentRoom });
    });

    socket.on('history', (msgs) => {
      const el = document.getElementById('messages');
      el.innerHTML = '';
      if (!msgs || msgs.length === 0) {
        el.innerHTML = '<div class="sys-msg">ยังไม่มีข้อความ เริ่มแชทกันเลย! 🎉</div>';
        return;
      }
      msgs.forEach(m => renderMsg(m));
      el.scrollTop = el.scrollHeight;
    });

    socket.on('message', (m) => {
      renderMsg(m);
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    });

    socket.on('online_count', (count) => {
      document.getElementById('online-num').textContent = count;
    });

    socket.on('typing', ({ uid, name, isTyping }) => {
      if (isTyping) {
        typingUsers[uid] = name;
      } else {
        delete typingUsers[uid];
      }
      updateTypingUI();
    });

    socket.on('reaction_update', ({ msgId, reactions }) => {
      updateReactions(msgId, reactions);
    });

    buildRooms();
  };

  /* ── Rooms bar ── */
  function buildRooms() {
    const bar = document.getElementById('rooms-bar');
    bar.innerHTML = '';
    ROOMS.forEach(r => {
      const b = document.createElement('button');
      b.className = 'room-chip' + (r.id === currentRoom ? ' active' : '');
      b.textContent = r.label;
      b.onclick = () => switchRoom(r.id);
      bar.appendChild(b);
    });
  }

  /* ── Switch room ── */
  function switchRoom(roomId) {
    currentRoom = roomId;
    document.querySelectorAll('.room-chip').forEach((b, i) => {
      b.classList.toggle('active', ROOMS[i].id === roomId);
    });
    document.getElementById('messages').innerHTML = '';
    document.getElementById('typing-area').innerHTML = '';
    Object.keys(typingUsers).forEach(k => delete typingUsers[k]);
    if (socket) socket.emit('switch_room', roomId);
  }

  /* ── Render message ── */
  function renderMsg(m) {
    const el = document.getElementById('messages');
    const isMe = m.uid === (myId || socket?.id);
    const t = m.ts ? new Date(m.ts) : new Date();
    const timeStr = t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0');

    if (m.type === 'system') {
      const d = document.createElement('div');
      d.className = 'sys-msg'; d.textContent = m.text;
      el.appendChild(d); return;
    }

    const row = document.createElement('div');
    row.className = 'msg-row ' + (isMe ? 'me' : 'other');
    row.dataset.msgId = m.id;

    const av = document.createElement('div');
    av.className = 'avatar-sm'; av.textContent = m.avatar || '🐱';

    const col = document.createElement('div');
    col.className = 'msg-col';

    if (!isMe) {
      const sn = document.createElement('div');
      sn.className = 'msg-sender'; sn.textContent = m.name;
      col.appendChild(sn);
    }

    const bub = document.createElement('div');
    bub.className = 'bubble ' + (isMe ? 'me' : 'other');
    bub.textContent = m.text;
    bub.ondblclick = () => addReaction(m.id, '❤️');

    const tm = document.createElement('div');
    tm.className = 'msg-time'; tm.textContent = timeStr;

    col.appendChild(bub);
    col.appendChild(tm);

    // reactions
    const reactDiv = document.createElement('div');
    reactDiv.className = 'reactions';
    reactDiv.dataset.msgId = m.id;
    if (m.reactions) renderReactionPills(reactDiv, m.id, m.reactions);
    col.appendChild(reactDiv);

    row.appendChild(av);
    row.appendChild(col);
    el.appendChild(row);
  }

  /* ── Render reaction pills ── */
  function renderReactionPills(reactDiv, msgId, reactions) {
    reactDiv.innerHTML = '';
    Object.entries(reactions).forEach(([emoji, users]) => {
      const count = Object.keys(users).length;
      if (count === 0) return;
      const isMine = myId && users[myId];
      const pill = document.createElement('div');
      pill.className = 'react-pill' + (isMine ? ' mine' : '');
      pill.innerHTML = `${emoji}<span class="react-count">${count}</span>`;
      pill.onclick = () => addReaction(msgId, emoji);
      reactDiv.appendChild(pill);
    });
  }

  /* ── Update reactions ── */
  function updateReactions(msgId, reactions) {
    const reactDiv = document.querySelector(`.reactions[data-msg-id="${msgId}"]`);
    if (reactDiv) renderReactionPills(reactDiv, msgId, reactions);
  }

  /* ── Send ── */
  window.sendMessage = function() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !socket) return;
    input.value = ''; input.style.height = 'auto';
    socket.emit('message', { text });
  };

  /* ── Reactions ── */
  function addReaction(msgId, emoji) {
    if (!socket) return;
    socket.emit('react', { msgId, emoji, room: currentRoom });
  }

  /* ── Typing indicator ── */
  function updateTypingUI() {
    const area = document.getElementById('typing-area');
    const names = Object.values(typingUsers);
    if (names.length === 0) { area.innerHTML = ''; return; }
    area.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>${names[0]} กำลังพิมพ์...`;
  }

  document.getElementById('msg-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    if (socket) {
      socket.emit('typing', { room: currentRoom, isTyping: true });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit('typing', { room: currentRoom, isTyping: false });
      }, 2500);
    }
  });

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth >= 640) {
      e.preventDefault(); sendMessage();
    }
  });

  /* ── Helpers ── */
  window.addEmoji = (e) => {
    const inp = document.getElementById('msg-input');
    inp.value += e; inp.focus();
  };
  window.changeNamePrompt = () => {
    document.getElementById('config-modal').classList.remove('open');
    localStorage.removeItem('vc_name');
    location.reload();
  };
  window.clearLocalAndReload = () => {
    if (socket) socket.disconnect();
    localStorage.clear(); location.reload();
  };

  /* ── Auto-fill from localStorage ── */
  const savedName = localStorage.getItem('vc_name');
  const savedAv = localStorage.getItem('vc_avatar');
  if (savedName) document.getElementById('name-field').value = savedName;
  if (savedAv) {
    selectedAvatar = savedAv;
    document.querySelectorAll('.av-opt').forEach(d => {
      d.classList.toggle('selected', d.textContent === savedAv);
    });
  }
</script>
</body>
</html>
